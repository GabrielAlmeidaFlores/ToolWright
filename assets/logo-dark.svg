    </linearGradient>
    <linearGradient id="rule" x1="190" y1="132" x2="330" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="28" y="28" width="112" height="112" rx="30" fill="url(#mark)"/>
  <rect x="29" y="29" width="110" height="110" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>
  <path d="M52 58 H108" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M80 58 V110" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M66 86 L80 100 L104 74" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>
  <path d="M112 40 C113.4 46.1 115.3 48 121.4 49.4 C115.3 50.8 113.4 52.7 112 58.8 C110.6 52.7 108.7 50.8 102.6 49.4 C108.7 48 110.6 46.1 112 40 Z" fill="#FFFFFF"/>
