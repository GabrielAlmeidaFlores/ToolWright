# Name: Documentation site
# Purpose: Builds the browsable documentation with MkDocs Material.
# Usage: mkdocs build --strict; mkdocs serve
# Validation: mkdocs build --strict
# References: docs/index.md, docs/validation-checklist.md

site_name: ToolWright
site_description: Repeatable, safe, provider-neutral development environment for AI coding agents.
site_author: ToolWright contributors
repo_url: https://github.com/GabrielAlmeidaFlores/ToolWright
repo_name: GabrielAlmeidaFlores/ToolWright

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js

nav:
  - Home: index.md
  - Install:
      - toolwright CLI: installation/toolwright-cli.md
      - OpenCode: installation/opencode.md
      - Code intelligence: installation/code-intelligence.md
      - Ralph: installation/ralph.md
      - Adapter validation: installation/adapter-validation.md
  - Use:
      - CLI reference: cli/README.md
      - Profiles: profiles/README.md
      - Catalog: catalog/README.md
      - Verification: verification/README.md
      - Governance: governance/README.md
      - Memory: memory/README.md
      - Specs: specs/README.md
      - Evaluations: evals/README.md
      - Task board: board/README.md
      - Memory plugin: plugin/README.md
  - Configure:
      - OpenCode V2: configuration/opencode-v2.md
      - Compatibility:
          - Overview: compatibility/README.md
          - OpenCode: compatibility/opencode.md
          - GitHub Copilot: compatibility/github-copilot.md
          - Claude Code: compatibility/claude.md
          - OpenAI GPT and Codex: compatibility/openai-gpt.md
          - Policy: compatibility/policy.md
      - Code intelligence:
          - Overview: code-intelligence/README.md
          - ripgrep: code-intelligence/ripgrep.md
          - ast-grep: code-intelligence/ast-grep.md
          - Serena: code-intelligence/serena.md
          - CodeGraph: code-intelligence/codegraph.md
          - Optional tools: code-intelligence/optional-tools.md
  - Project:
      - Architecture: architecture/overview.md
      - Testing: architecture/testing.md
      - Agents: agents/roles.md
      - OpenCode artifacts: agents/compatibility.md
      - Ralph orchestration: orchestration/ralph.md
      - Security: security/README.md
      - Provenance: provenance/README.md
      - Release: release/README.md
      - Release checklist: RELEASE_CHECKLIST.md
      - Validation checklist: validation-checklist.md
      - Troubleshooting: troubleshooting/README.md
